<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhoon Ready</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Family Typhoon Preparation</h1>
      <p>Prepare before the storm arrives.</p>

      <section>
        <h2>Checklist</h2>
        <ul>
          <li>Water</li>
          <li>Food</li>
          <li>Flashlight</li>
          <li>Medicines</li>
          <li>Documents</li>
        </ul>
      </section>

      <section>
        <h2>Emergency Plan</h2>
        <label for="meeting">Meeting place</label>
        <input id="meeting" type="text" placeholder="Barangay hall" />
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
