<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhoon-Ready Household Guide</title>
    <meta name="description" content="Educational demo content for household typhoon preparation." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <p class="tag">Educational demo content</p>
        <h1>Typhoon-Ready Household Guide</h1>
      </div>
    </header>

    <main class="container layout">
      <section class="panel">
        <h2>Go-Bag Checklist</h2>
        <div class="progress" aria-live="polite">0 / 8</div>
        <ul>
          <li><label><input type="checkbox" /> Drinking water</label></li>
          <li><label><input type="checkbox" /> Ready-to-eat food</label></li>
          <li><label><input type="checkbox" /> Flashlight with batteries</label></li>
          <li><label><input type="checkbox" /> Battery-powered radio</label></li>
          <li><label><input type="checkbox" /> First-aid kit</label></li>
          <li><label><input type="checkbox" /> Medications</label></li>
          <li><label><input type="checkbox" /> Important documents</label></li>
          <li><label><input type="checkbox" /> Cash and contacts</label></li>
        </ul>
      </section>

      <section class="panel">
        <h2>Emergency Family Plan</h2>
        <form>
          <label for="meeting-place">Meeting place</label>
          <input id="meeting-place" type="text" placeholder="Barangay hall" />

          <label for="primary-contact">Primary contact</label>
          <input id="primary-contact" type="text" placeholder="Name and number" />

          <label for="backup-contact">Backup contact</label>
          <input id="backup-contact" type="text" placeholder="Name and number" />
        </form>
      </section>

      <section class="panel">
        <h2>Evacuation Reminders</h2>
        <ul>
          <li>Keep charged devices ready.</li>
          <li>Store water and food securely.</li>
          <li>Prepare a meeting point for family members.</li>
        </ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
